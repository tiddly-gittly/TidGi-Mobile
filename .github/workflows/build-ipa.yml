name: Build iOS IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-ipa.yml'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
  push:
    tags:
      - 'ipa-v*.*.*'
      - 'v*.*.*'
    paths-ignore:
      - 'README.md'
      - 'wiki/**'
      - 'public/**'
      - 'scripts/**'
      - '.vscode'
      - '.idea'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Type check and lint
        run: |
          pnpm run check
          pnpm run lint

      - name: Build tw plugins & scripts
        run: |
          pnpm run build:plugin
          pnpm run build:tw-assets
          pnpm run build:wiki-template

      - name: Expo prebuild (iOS)
        run: pnpm exec expo prebuild -p ios --clean

      - name: Verify generated iOS local-network policy
        shell: bash
        run: |
          set -euo pipefail
          PLIST_PATH=$(grep -rl "NSLocalNetworkUsageDescription" ios --include='Info.plist' | head -1)
          if [ -z "$PLIST_PATH" ]; then
            echo "Generated application Info.plist was not found"
            exit 1
          fi
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - "$PLIST_PATH")" = "true"
          DESCRIPTION=$(plutil -extract NSLocalNetworkUsageDescription raw -o - "$PLIST_PATH")
          if [ -z "$DESCRIPTION" ]; then
            echo "NSLocalNetworkUsageDescription must not be empty"
            exit 1
          fi
          echo "Verified generated policy in $PLIST_PATH"

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - uses: actions/cache@v5
        name: Cache CocoaPods
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build unsigned iOS app
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Build failed: no .app found in build/Build/Products/Release-iphoneos"
            exit 1
          fi

          BUILT_PLIST="$APP_PATH/Info.plist"
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - "$BUILT_PLIST")" = "true"
          DESCRIPTION=$(plutil -extract NSLocalNetworkUsageDescription raw -o - "$BUILT_PLIST")
          if [ -z "$DESCRIPTION" ]; then
            echo "Built NSLocalNetworkUsageDescription must not be empty"
            exit 1
          fi

          mkdir -p /tmp/ios-artifacts
          cp "$BUILT_PLIST" /tmp/ios-artifacts/TidGi-Info.plist
          STAGING_DIR="$RUNNER_TEMP/ipa-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/Payload"
          cp -R "$APP_PATH" "$STAGING_DIR/Payload/"
          (cd "$STAGING_DIR" && zip -qry /tmp/ios-artifacts/TidGi.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa-${{ github.run_number }}-${{ github.sha }}
          path: |
            /tmp/ios-artifacts/TidGi.ipa
            /tmp/ios-artifacts/TidGi-Info.plist
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: true
          generate_release_notes: false
          files: /tmp/ios-artifacts/TidGi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

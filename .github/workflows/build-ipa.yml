name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ipa-v*.*.*'
      - 'v*.*.*'
    paths-ignore:
      - 'README.md'
      - 'wiki/**'
      - 'public/**'
      - 'scripts/**'
      - '.vscode'
      - '.idea'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Type check and lint
        run: |
          pnpm run check
          pnpm run lint

      - name: Build tw plugins & scripts
        run: |
          pnpm run build:plugin
          pnpm run build:tw-assets
          pnpm run build:wiki-template

      - name: Expo prebuild (iOS)
        run: pnpm exec expo prebuild -p ios --clean

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update

      - uses: actions/cache@v5
        name: Cache CocoaPods
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build unsigned iOS app
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Build failed: no .app found in build/Build/Products/Release-iphoneos"
            exit 1
          fi

          mkdir -p /tmp/ios-artifacts
          STAGING_DIR="$RUNNER_TEMP/ipa-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/Payload"
          cp -R "$APP_PATH" "$STAGING_DIR/Payload/"
          (cd "$STAGING_DIR" && zip -qry /tmp/ios-artifacts/TidGi.ipa Payload)

      - name: Build release notes
        run: |
          set -euo pipefail

          RELEASE_TAG="$GITHUB_REF_NAME"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          CURRENT_DATE=$(git log -1 --format=%cs "$RELEASE_TAG")
          PREVIOUS_DATE="N/A"
          TAG_RANGE="${RELEASE_TAG}"
          if [ -n "$PREVIOUS_TAG" ]; then
            PREVIOUS_DATE=$(git log -1 --format=%cs "$PREVIOUS_TAG")
            TAG_RANGE="${PREVIOUS_TAG} → ${RELEASE_TAG}"
          fi

          COMMIT_COUNT=$(git rev-list --count "${PREVIOUS_TAG:+$PREVIOUS_TAG..}${RELEASE_TAG}")
          DIFF_STATS=$(git diff --shortstat "${PREVIOUS_TAG:+$PREVIOUS_TAG..}${RELEASE_TAG}" | sed 's/^ *//')
          if [ -z "$DIFF_STATS" ]; then
            DIFF_STATS="1 file changed"
          fi

          cat > /tmp/ios-artifacts/RELEASE_NOTES.md <<EOF
          <details>
            <summary>## TidGi-Mobile ${RELEASE_TAG} 发布报告</summary>

          **发布时间**: ${PREVIOUS_DATE} ~ ${CURRENT_DATE}<br>
          **标签范围**: ${TAG_RANGE}<br>
          **提交数**: ${COMMIT_COUNT} 个提交<br>
          **变更概览**: ${DIFF_STATS}

          ---

          ### 🍎 iOS 预发布变更

          #### 1. 产出可供侧载工具重签的 IPA
          - iOS CI 现在构建 iPhoneOS 真机架构 `.app` 并封装为 `.ipa`
          - 面向爱思助手、AltServer、SideStore 等用户侧重签场景
          - 不再依赖仓库内 Apple Developer Program 发布证书

          #### 2. 保持统一的 GitHub Release 聚合发布
          - 继续使用常规 `v*.*.*` tag 触发 Android APK / AAB / iOS IPA
          - 所有产物继续汇总到同一个 GitHub Release

          </details>

          <details>
            <summary>## TidGi-Mobile ${RELEASE_TAG} Release Report</summary>

          **Release Period**: ${PREVIOUS_DATE} ~ ${CURRENT_DATE}<br>
          **Tag Range**: ${TAG_RANGE}<br>
          **Commits**: ${COMMIT_COUNT} commit(s)<br>
          **Change Summary**: ${DIFF_STATS}

          ---

          ### 🍎 iOS Prerelease Changes

          #### 1. Produce an IPA intended for user-side resigning
          - The iOS CI now builds an iPhoneOS device `.app` and packages it as an `.ipa`
          - Targets user-side resign flows such as Aisi Assistant, AltServer, and SideStore
          - No longer depends on repository-managed Apple Developer Program distribution signing

          #### 2. Keep one aggregated GitHub Release across platforms
          - The regular `v*.*.*` tag still triggers Android APK / AAB / iOS IPA builds together
          - All assets continue to be attached to the same GitHub Release

          </details>
          EOF

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa-${{ github.run_number }}-${{ github.sha }}
          path: |
            /tmp/ios-artifacts/TidGi.ipa
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: true
          generate_release_notes: false
          body_path: /tmp/ios-artifacts/RELEASE_NOTES.md
          files: /tmp/ios-artifacts/TidGi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

packages:
  - .
  - plugins

allowBuilds:
  '@parcel/watcher': true
  detox: true
  dprint: true
  dtrace-provider: true
  esbuild: true
  less: true
  svelte-preprocess: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - detox
  - dprint
  - dtrace-provider
  - esbuild
  - expo-tiddlywiki-filesystem-android-external-storage
  - less
  - svelte-preprocess
  - unrs-resolver

patchedDependencies:
  expo-tiddlywiki-filesystem-android-external-storage: patches/expo-tiddlywiki-filesystem-android-external-storage.patch

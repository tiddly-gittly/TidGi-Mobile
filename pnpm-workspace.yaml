packages:
  - .
  - plugins

allowBuilds:
  '@ipshipyard/node-datachannel': true
  '@parcel/watcher': false
  better-sqlite3: true
  detox: true
  dprint: false
  dtrace-provider: false
  esbuild: false
  less: false
  svelte-preprocess: true
  unrs-resolver: false

peerDependencyRules:
  allowedVersions:
    memeloop: '>=0.1.0 <0.3.0'

minimumReleaseAgeExclude:
  - expo-tiddlywiki-filesystem-android-external-storage@2.12.3
  - '@memeloop/libp2p@0.2.5'
  - '@memeloop/react-ui@0.1.7'
  - 'memeloop@0.2.9'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - detox
  - dprint
  - dtrace-provider
  - esbuild
  - expo-tiddlywiki-filesystem-android-external-storage
  - less
  - svelte-preprocess
  - unrs-resolver

packages:
  - .
  - plugins

allowBuilds:
  '@parcel/watcher': true
  '@ipshipyard/node-datachannel': false
  detox: true
  dprint: true
  dtrace-provider: true
  esbuild: true
  less: true
  svelte-preprocess: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - expo-tiddlywiki-filesystem-android-external-storage@2.12.3

onlyBuiltDependencies:
  - '@parcel/watcher'
  - detox
  - dprint
  - dtrace-provider
  - esbuild
  - expo-tiddlywiki-filesystem-android-external-storage
  - less
  - svelte-preprocess
  - unrs-resolver

packages:
  - .
  - plugins

allowBuilds:
  '@ipshipyard/node-datachannel': true
  '@parcel/watcher': false
  detox: true
  dprint: false
  dtrace-provider: false
  esbuild: false
  less: false
  svelte-preprocess: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - expo-tiddlywiki-filesystem-android-external-storage@2.12.3
  - '@memeloop/libp2p@0.1.0'
  - '@memeloop/react-ui@0.1.0 || 0.1.1'
  - 'memeloop@0.1.0 || 0.1.1 || 0.1.2 || 0.1.3'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - detox
  - dprint
  - dtrace-provider
  - esbuild
  - expo-tiddlywiki-filesystem-android-external-storage
  - less
  - svelte-preprocess
  - unrs-resolver
